name: BFFA01
version: '@project.version@'
main: infinode.org.example.bFFA01.BFFA01
api-version: '1.21'
commands:
  bffa:
    description: "Main command for BuildFFA"
    usage: "/bffa"
    permission: "bffa.admin"
  stats:
    description: "View your stats"
    usage: "/stats"
  kit:
    description: "Organize your kit"
    usage: "/kit"
  savekit:
    description: "Save your current kit layout"
    usage: "/savekit"

permissions:
  bffa.admin:
    description: Administer BuildFFA maps, coins, and stats
    default: op