# ==========================================================================
#  BuildFFA - main configuration
#
#  Supported servers: Spigot, Paper and forks, Minecraft 1.20.1 and newer.
#  Colours: use &-codes (&a) or hex (&#55FFAA) anywhere a text is expected.
#
#  Arenas live in maps.yml, the sidebar lives in scoreboard.yml.
#  Reload everything in game with /bffa reload.
# ==========================================================================

# Do not edit. Used to migrate older configurations automatically.
config-version: 2

arena:
  # Seconds between arena swaps.
  map-swap-interval: 600
  # Seconds before the swap at which players are warned.
  map-swap-warnings: [ 60, 30, 10, 5, 3, 2, 1 ]
  # Seconds before the swap at which placed blocks are cleared and building
  # is locked, so nobody builds into a map that is about to disappear.
  reset-blocks-before-swap: 3
  # Fallback heights for arenas that do not define their own.
  # Below the death level a player dies, above the safe zone they cannot be hurt.
  default-death-y-level: 50
  default-safezone-y-level: 90

building:
  # Seconds a placed block survives.
  block-remove-delay: 10
  # Seconds before removal at which the block changes colour as a warning.
  # Set to 0 to disable the warning.
  block-warning-seconds: 2
  warning-material: REDSTONE_BLOCK
  # Allow players to break blocks that players placed. The map itself is
  # always protected.
  breakable-placed-blocks: true

combat:
  # Seconds a player stays "in combat" after taking or dealing damage.
  # Set to 0 to disable combat tagging entirely.
  tag-seconds: 10
  # Block commands while in combat so nobody escapes with /hub.
  block-commands: true
  allowed-commands: [ msg, r, tell, shop, stats, kit ]
  # Count a disconnect during combat as a death and award the kill.
  punish-combat-log: true
  # Colour names red in combat and green otherwise, in chat list and above heads.
  colour-names: true

rewards:
  coins-per-kill: 5
  # Extra coins per killstreak level, e.g. 1 gives +4 coins on a 5 streak.
  coins-per-killstreak: 1
  heal-on-kill: true
  refill-arrows: true
  # Building blocks handed out per kill, capped at a full stack.
  blocks-per-kill: 16

protection:
  cancel-fall-damage: true
  cancel-explosion-damage: true
  disable-hunger: true
  disable-durability: true
  prevent-item-drop: true
  prevent-offhand: true
  prevent-mob-spawns: true

display:
  scoreboard: true
  bossbar: true
  bossbar-title: "&7Next arena in &b%time%"
  # BLUE, GREEN, PINK, PURPLE, RED, WHITE or YELLOW
  bossbar-color: BLUE
  actionbar-combat-timer: true
  titles: true
  tablist: true
  tablist-header:
    - ""
    - "&b&lBUILD&f&lFFA"
    - "&7Arena: &f%map%"
    - ""
  tablist-footer:
    - ""
    - "&7Online: &f%online%"
    - "&bbffa.infinode.de"
    - ""
  # Floating top list above the arena spawn.
  holograms: true
  hologram-entries: 5
  hologram-offset-y: 3.5
  hologram-refresh-seconds: 30

storage:
  # Seconds between statistic saves. Data is also saved on shutdown.
  autosave-seconds: 300

# --------------------------------------------------------------------------
#  Kit
#  Keys under "inventory" are hotbar or inventory slots (0-35).
#  Players can reorder their hotbar with /kit.
# --------------------------------------------------------------------------
kit:
  inventory:
    '0':
      material: IRON_SWORD
      amount: 1
      enchantments:
        SHARPNESS: 1
    '1':
      material: STICK
      amount: 1
      enchantments:
        KNOCKBACK: 1
    '2':
      material: SANDSTONE
      amount: 64
    '3':
      material: BOW
      amount: 1
    '8':
      material: ARROW
      amount: 16
  armor:
    helmet:
      material: IRON_HELMET
    chestplate:
      material: IRON_CHESTPLATE
    leggings:
      material: IRON_LEGGINGS
    boots:
      material: IRON_BOOTS

# --------------------------------------------------------------------------
#  Killstreaks
#  Each numbered key is the streak that unlocks the reward.
#  effects: "<effect>:<ticks>:<amplifier>"   items: "<MATERIAL>:<amount>"
# --------------------------------------------------------------------------
killstreaks:
  # Announce every N kills beyond the rewards below. 0 disables it.
  broadcast-every: 5
  '3':
    message: "&fSpeed II for 10 seconds"
    broadcast: false
    sound: "entity.player.levelup"
    coins: 0
    effects: [ "speed:200:1" ]
    items: [ ]
  '5':
    message: "&f5 cobwebs"
    broadcast: true
    sound: "entity.player.levelup"
    coins: 10
    effects: [ ]
    items: [ "COBWEB:5" ]
  '10':
    message: "&fa golden apple and 25 coins"
    broadcast: true
    sound: "ui.toast.challenge_complete"
    coins: 25
    effects: [ "regeneration:100:1" ]
    items: [ "GOLDEN_APPLE:1" ]

