# BuildFFA configuration
# config-version is migrated automatically. Do not delete it.
config-version: 2

# Language file in plugins/BFFA01/lang/. Ships with en and de.
# Any messages: keys still present in this file override the language file.
language: en

# yaml (default), sqlite, or mysql.
# SQLite is bundled. MySQL needs mariadb-java-client.jar or mysql-connector-j.jar
# in plugins/BFFA01/drivers/, then a restart.
storage:
  type: yaml
  sqlite:
    file: data.db
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: bffa
    username: bffa
    password: ""
    parameters: "useSSL=false&allowPublicKeyRetrieval=true"

# Armor-stand leaderboard above the current spawn. Leave false unless you want it.
# backend: auto (DecentHolograms, then FancyHolograms, then armor stands), decentholograms, fancyholograms, armorstand
holograms:
  enabled: false
  backend: auto
  id: bffa-top

# Soft dependencies. The plugin loads when none of these are installed.
# enabled: false turns a hook off even if that plugin is on the server.
integrations:
  placeholderapi:
    enabled: true
  vault:
    enabled: true
    # Shop spends internal coins, or the Vault economy.
    shop: internal
    # Kill reward: internal coins, vault, or both.
    # kill-amount is the coins paid per kill. 0 pays nothing.
    # A config that does not contain this key also pays nothing.
    kill-reward: internal
    kill-amount: 5
  luckperms:
    enabled: true
  worldguard:
    enabled: true
    # State flags bffa-build and bffa-pvp, default allow. Registered on load.
    flags: true
    # Optional region id. maps.<name>.region overrides this for that arena.
    arena-region: ""
    deny-build-outside: false
    deny-pvp-outside: false
  decentholograms:
    enabled: true
  fancyholograms:
    enabled: true
  geyser:
    enabled: true
  floodgate:
    enabled: true
    # Bedrock players get forms for /shop and /stats. Java players keep the chest GUI.
    forms: true
  viaversion:
    enabled: true
  miniplaceholders:
    enabled: true
  metrics:
    enabled: true
    # bStats plugin id. 0 does not send anything. plugins/bStats/config.yml can still opt out.
    plugin-id: 0
  discord:
    enabled: false
    # Only https://discord.com/api/webhooks/... (discordapp.com, canary, and ptb too).
    url: ""
    username: BuildFFA
    kills: true
    deaths: false
    streaks: true
    milestones: [5, 10, 15, 20, 25, 50]
    map-switch: false
    rate-limit: 30
    kill-message: "%killer% killed %victim% (streak %streak%)"
    death-message: "%player% died"
    streak-message: "%player% reached a %streak% killstreak"
    map-message: "Map changed to %map%"

# Damage dealt and taken. Assists count other players inside the window
# who dealt at least assist-minimum health. Live numbers follow presentation.yml
# and each player's settings toggle. Set enabled to false to hide them.
damage:
  enabled: true
  assist-seconds: 12
  assist-minimum: 2.0

# Several BuildFFA servers behind one proxy. Leave enabled false for a single server.
# Shared stats need storage.type mysql. Set a different server-id on each server.
# Redis is optional and carries streak broadcasts plus leaderboard refreshes.
# network.messenger also sends them on the bffa:net plugin channel when a proxy forwards it.
network:
  # false stays local. true always joins the cluster.
  # auto joins when storage.type is mysql or mariadb, so one image can scale without a per-pod edit.
  enabled: auto
  # Ignored. Identity comes from BFFA_SERVER_ID, then POD_NAME or HOSTNAME when that name is unique, otherwise a random id per boot.
  server-id: ""
  leaderboard-seconds: 30
  messenger: true
  redis:
    host: ""
    port: 6379
    password: ""
    channel: bffa

# The time in seconds between map swaps
map-swap-interval: 600

# The time in seconds before placed blocks disappear
block-remove-delay: 10

# The time in seconds that natural regeneration is paused after taking damage from a player
combat-regen-pause: 10

# Default fall Y-level and safezone (used if a map doesn't specify one)
default-death-y-level: 50
default-safezone-y-level: 90

# The name of the maps and their spawn locations. You can add more maps here.
maps:
  basketball:
    world: "world"
    x: 38.5
    y: 201.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
    death-y-level: 85
    safezone-y-level: 190
  challenger:
    world: "world"
    x: -55.5
    y: 204.0
    z: -495.0
    yaw: 0.0
    pitch: 0.0
    death-y-level: 135
    safezone-y-level: 190
  mariokart:
    world: "world"
    x: 13.5
    y: 239.0
    z: 665.0
    yaw: 0.0
    pitch: 0.0
    death-y-level: 162
    safezone-y-level: 232

# Kit configuration. Enchantment names accept both modern ids (sharpness) and legacy ids (DAMAGE_ALL).
kit:
  inventory:
    0:
      material: IRON_SWORD
      amount: 1
      enchantments:
        sharpness: 1
    1:
      material: STICK
      amount: 1
      enchantments:
        knockback: 1
    2:
      material: SANDSTONE
      amount: 64
    3:
      material: BOW
      amount: 1
    8:
      material: ARROW
      amount: 16
  armor:
    helmet:
      material: IRON_HELMET
    chestplate:
      material: IRON_CHESTPLATE
    leggings:
      material: IRON_LEGGINGS
    boots:
      material: IRON_BOOTS
