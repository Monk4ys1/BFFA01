# BuildFFA Configuration

# The time in seconds between map swaps
map-swap-interval: 300

# The time in seconds before placed blocks disappear
block-remove-delay: 5

# Safe Y level: below this, players are considered dead (fall to void)
death-y-level: 50

# Safezone Y level: above this, players are invulnerable
safezone-y-level: 90

# The name of the maps and their spawn locations. You can add more maps here.
maps:
  classic:
    world: "world"
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  desert:
    world: "world"
    x: 100.5
    y: 100.0
    z: 100.5
    yaw: 0.0
    pitch: 0.0

# Kit configuration
kit:
  inventory:
    0:
      material: IRON_SWORD
      amount: 1
    1:
      material: STICK
      amount: 1
      enchantments:
        KNOCKBACK: 1
    2:
      material: SANDSTONE
      amount: 64
    3:
      material: BOW
      amount: 1
    8:
      material: ARROW
      amount: 64
  armor:
    helmet:
      material: CHAINMAIL_HELMET
    chestplate:
      material: CHAINMAIL_CHESTPLATE
    leggings:
      material: CHAINMAIL_LEGGINGS
    boots:
      material: CHAINMAIL_BOOTS

messages:
  prefix: "&8[&bBuildFFA&8] "
  map-swapped: "&7The map has been changed to &e%map%&7!"
  map-swap-warning: "&7The map will change in &e%seconds% &7seconds!"
  player-killed: "&c%player% &7was killed by &c%killer%&7."
  player-died: "&c%player% &7died."
  command-usage: "&cUsage: /bffa <setmap> <mapname>"
  no-permission: "&cYou do not have permission to do that."
  map-set: "&aSpawn location for map &e%map% &aset successfully."
