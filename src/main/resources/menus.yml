# Chest menus. Slots are 0-53 in a 6-row chest so Geyser can click them.
# Left click and right click do the same thing. Titles should stay short.
filler: GRAY_STAINED_GLASS_PANE
frame:
  - CYAN_STAINED_GLASS_PANE
  - LIGHT_BLUE_STAINED_GLASS_PANE
  - BLUE_STAINED_GLASS_PANE
  - PURPLE_STAINED_GLASS_PANE
  - MAGENTA_STAINED_GLASS_PANE

menus:
  hub:
    rows: 5
    title: menu-hub-title
    items:
      shop:
        slot: 20
        material: EMERALD
        name: menu-hub-shop
        lore:
          - menu-hub-shop-lore
        action: open:shop
      kit:
        slot: 22
        material: CHEST
        name: menu-hub-kit
        lore:
          - menu-hub-kit-lore
